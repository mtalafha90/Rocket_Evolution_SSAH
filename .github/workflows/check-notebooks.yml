name: Check workshop notebooks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install workshop dependencies
        run: python -m pip install -r requirements.txt
      - name: Run data checks and both notebooks in fresh kernels
        run: python scripts/validate_workshop.py
